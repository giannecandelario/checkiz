<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101915">
  <title>Live payment overlay · Chekiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>
  <script src="shared.js" defer></script>
  <script src="overlay.js" defer></script>
</head>
<body class="overlay-page">
  <main class="overlay-stage">
    <section class="overlay-card" id="overlayCard" data-status="WAITING" aria-live="polite" aria-atomic="true">
      <div class="overlay-brand"><span class="overlay-brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M7 16.4 13.2 22 25 9.5"/></svg></span><span>CHEKIZ</span></div>
      <span class="overlay-symbol" id="overlaySymbol" aria-hidden="true">…</span>
      <div class="overlay-main">
        <p class="overlay-status-label" id="overlayStatusLabel">Waiting for payment checks</p>
        <h1 id="overlayTitle">Ready when you are</h1>
        <p class="overlay-message" id="overlayMessage">Latest receipt result will appear here.</p>
      </div>
      <div class="overlay-order" id="overlayOrder" hidden></div>
      <p class="overlay-warning" id="overlayWarning" hidden></p>
    </section>
    <p class="overlay-connection" id="overlayConnection" role="status" aria-live="polite">Connecting to payment desk…</p>
  </main>
</body>
</html>
